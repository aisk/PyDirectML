[build-system]
requires = ["setuptools>=77", "cmake>=3.15"]
build-backend = "setuptools.build_meta"

[project]
name = "directml"
version = "0.1.0"
description = "Python binding for DirectML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["numpy"]
keywords = ["DirectML", "DirectX", "GPU"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/aisk/PyDirectML"

[project.optional-dependencies]
# What samples/ needs: Pillow for the image samples; the hub and safetensors
# readers and transformers (its CLIP tokenizer only, no PyTorch) for samples/sdxl.
samples = ["pillow", "safetensors", "huggingface_hub", "transformers"]
test = ["pytest"]

[tool.setuptools]
packages = ["directml"]

[tool.setuptools.package-data]
directml = ["py.typed", "*.pyi"]
